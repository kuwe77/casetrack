name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Configure local test secret
        run: node -e "require('node:fs').writeFileSync('.dev.vars','AUTH_SECRET='+require('node:crypto').randomBytes(48).toString('hex'))"
      - run: npm run db:local
      - name: Run Cloudflare integration checks
        run: |
          npm run dev:api > /tmp/casetrack-api.log 2>&1 &
          npm run dev:scheduler > /tmp/casetrack-scheduler.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8788/api/health && curl --fail --silent http://127.0.0.1:8789/__scheduled; then break; fi
            sleep 1
          done
          npm run test:integration
